# -----------------------------------------------------------------------------
# ROLE: mongodb_setup - Secure MongoDB Installation and Configuration
# -----------------------------------------------------------------------------

---
# -----------------------------------------------------------------------------
# PHASE 1: Install MongoDB and Prerequisites
# -----------------------------------------------------------------------------

- name: Install gnupg and necessary packages
  ansible.builtin.apt:
    name:
      - gnupg
      - curl
      - python3-pip
      - python3-venv
      - python3-full
    state: present
    update_cache: yes
  become: true

- name: Add MongoDB GPG key
  ansible.builtin.shell: |
    mkdir -p /etc/apt/keyrings
    curl -fsSL https://pgp.mongodb.com/server-7.0.asc | \
      sudo gpg --dearmor -o /etc/apt/keyrings/mongodb-server-7.0.gpg
  args:
    creates: /etc/apt/keyrings/mongodb-server-7.0.gpg
  become: true

- name: Add MongoDB repository for Ubuntu 24.04 (using jammy mirror)
  ansible.builtin.apt_repository:
    repo: "deb [ signed-by=/etc/apt/keyrings/mongodb-server-7.0.gpg, arch=amd64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse"
    state: present
    filename: "mongodb-org-7.0"
  become: true

- name: Ensure MongoDB is installed
  ansible.builtin.package:
    name:
      - mongodb-org
      - mongodb-database-tools
    state: present
  become: true

# -----------------------------------------------------------------------------
# PHASE 2: Professional Cloud Tools Setup (Backblaze B2)
# -----------------------------------------------------------------------------

- name: Create Virtual Environment for Backblaze B2
  ansible.builtin.command:
    cmd: python3 -m venv /opt/b2_venv
    creates: /opt/b2_venv
  become: true

- name: Install latest B2 CLI into Virtual Environment
  ansible.builtin.pip:
    name: b2
    virtualenv: /opt/b2_venv
    state: present
  become: true

# -----------------------------------------------------------------------------
# PHASE 3: Service Configuration and Security
# -----------------------------------------------------------------------------

- name: Configure MongoDB to listen ONLY on localhost
  ansible.builtin.replace:
    path: /etc/mongod.conf
    regexp: '^(\s*)bindIp:.*'
    replace: "  bindIp: 127.0.0.1"
  become: true
  register: config_changed

- name: Ensure MongoDB is started and enabled
  ansible.builtin.service:
    name: mongod
    state: started
    enabled: yes
  become: true

- name: Restart MongoDB service if config changed
  ansible.builtin.service:
    name: mongod
    state: restarted
  when: config_changed.changed
  become: true

- name: Wait for MongoDB to fully initialize
  ansible.builtin.pause:
    seconds: 10
