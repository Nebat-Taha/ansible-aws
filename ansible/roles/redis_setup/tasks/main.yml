# -----------------------------------------------------------------------------
# ROLE: redis_setup - Secure Redis Installation and Configuration
# -----------------------------------------------------------------------------

---
# -----------------------------------------------------------------------------
# PHASE 1: Install Redis and Python Prerequisites
# -----------------------------------------------------------------------------

- name: Update package cache
  ansible.builtin.apt:
    update_cache: yes
    name:
      - redis-server
      - python3-pip
      - python3-venv
      - python3-full
    state: present
  become: true

# -----------------------------------------------------------------------------
# PHASE 2: Professional Cloud Tools Setup (Backblaze B2)
# -----------------------------------------------------------------------------

- name: Create Virtual Environment for Backblaze B2
  ansible.builtin.command:
    cmd: python3 -m venv /opt/b2_venv
    creates: /opt/b2_venv
  become: true

- name: Install latest B2 CLI into Virtual Environment
  ansible.builtin.pip:
    name: b2
    virtualenv: /opt/b2_venv
    state: present
  become: true

# -----------------------------------------------------------------------------
# PHASE 3: Security and Service Configuration
# -----------------------------------------------------------------------------

- name: Secure Redis to localhost only
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: "^bind "
    line: "bind 127.0.0.1 ::1"
  become: true
  register: redis_config

- name: Ensure Redis service is running and enabled
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true
  become: true

- name: Restart Redis if config changed
  ansible.builtin.service:
    name: redis-server
    state: restarted
  when: redis_config.changed
  become: true

# -----------------------------------------------------------------------------
# PHASE 4: Verification and Data Population
# -----------------------------------------------------------------------------

- name: Check Redis service status
  ansible.builtin.command: redis-cli ping
  register: redis_ping_status
  changed_when: false

- name: Set test string keys
  ansible.builtin.command: redis-cli SET {{ item.key }} "{{ item.value }}"
  loop:
    - { key: "test_key_1", value: "ansible_redis_value_1" }
    - { key: "test_key_2", value: "ansible_redis_value_2" }
  changed_when: true
  become: true

- name: Add a test hash (HSET)
  ansible.builtin.command: redis-cli HSET test_hash_key name "Ansible Test Hash" status "Ready"
  changed_when: true
  become: true

- name: Verify test data was set
  ansible.builtin.command: redis-cli GET test_key_1
  register: redis_data_check
  changed_when: false

- name: Print test data verification
  ansible.builtin.debug:
    msg: "Redis Check: {{ redis_data_check.stdout }}"
