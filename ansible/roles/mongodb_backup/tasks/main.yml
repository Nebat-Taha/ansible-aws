# -----------------------------------------------------------------------------
# ROLE: mongodb_backup - MongoDB Backup Automation
# -----------------------------------------------------------------------------

---
- name: Ensure MongoDB service is running
  ansible.builtin.service:
    name: mongod
    state: started
  become: true

# -----------------------------------------------------------------------------
# PHASE 1: Prepare Backup Archive
# -----------------------------------------------------------------------------

- name: Create local backup directory
  ansible.builtin.file:
    path: /tmp/mongodb_backup
    state: directory
    mode: "0755"
  become: true

- name: Create MongoDB dump with a unique name
  ansible.builtin.shell: |
    # Generate the backup file directly into the temp directory
    FILENAME="mongodb-backup-{{ ansible_date_time.iso8601_basic_short }}.gz"
    FULL_PATH="/tmp/mongodb_backup/$FILENAME"

    mongodump --uri "mongodb://127.0.0.1:27017" --archive=$FULL_PATH --gzip

    # Return the full path so it can be registered
    echo "$FULL_PATH"
  register: backup_file_info
  become: true

# -----------------------------------------------------------------------------
# PHASE 2: Secure Cloud Upload
# -----------------------------------------------------------------------------

- name: Upload MongoDB backup to Backblaze B2
  ansible.builtin.shell: |
    # Call the binary from the Venv created in the Setup role
    /opt/b2_venv/bin/b2 authorize-account {{ b2_app_id }} {{ b2_app_key }}
    /opt/b2_venv/bin/b2 upload-file "nebatn" "{{ backup_file_info.stdout | trim }}" "mongodb/{{ backup_file_info.stdout | basename | trim }}"
  no_log: true
  become: true
  vars:
    b2_app_id: "{{ lookup('env', 'BACKBLAZE_APPLICATION_KEY_ID') }}"
    b2_app_key: "{{ lookup('env', 'BACKBLAZE_APPLICATION_KEY') }}"

# -----------------------------------------------------------------------------
# PHASE 3: Cleanup
# -----------------------------------------------------------------------------

- name: Clean up local backup directory
  ansible.builtin.file:
    path: /tmp/mongodb_backup
    state: absent
  become: true
