# -----------------------------------------------------------------------------
# ROLE: redis_backup - Automated Redis Snapshot and Cloud Upload
# -----------------------------------------------------------------------------

---
- name: Ensure Redis service is running
  ansible.builtin.service:
    name: redis-server
    state: started
  become: true

# -----------------------------------------------------------------------------
# PHASE 1: Generate RDB Snapshot
# -----------------------------------------------------------------------------

- name: Trigger Redis BGSAVE (Background Save)
  ansible.builtin.command: redis-cli BGSAVE
  changed_when: true
  become: true

- name: Wait for BGSAVE to complete
  ansible.builtin.command: redis-cli INFO persistence
  register: redis_info
  until: '"rdb_bgsave_in_progress:0" in redis_info.stdout'
  retries: 12
  delay: 5
  changed_when: false

# -----------------------------------------------------------------------------
# PHASE 2: Prepare Backup File
# -----------------------------------------------------------------------------

- name: Get Redis data directory
  ansible.builtin.command: redis-cli CONFIG GET dir
  register: redis_dir_output
  changed_when: false
  become: true

- name: Set Redis paths
  ansible.builtin.set_fact:
    redis_data_dir: "{{ redis_dir_output.stdout_lines[1] }}"
    # We use a unique timestamp for the destination filename in B2
    b2_filename: "redis-backup-{{ ansible_date_time.iso8601_basic_short }}.rdb"
    temp_backup_path: "/tmp/redis-temp-backup.rdb"

- name: Copy RDB to temp location
  ansible.builtin.copy:
    src: "{{ redis_data_dir }}/dump.rdb"
    dest: "{{ temp_backup_path }}"
    remote_src: yes
    mode: "0644"
  become: true

# -----------------------------------------------------------------------------
# PHASE 3: Secure Cloud Upload
# -----------------------------------------------------------------------------

- name: Upload Redis RDB backup to Backblaze B2
  ansible.builtin.shell: |
    # Use the Virtual Environment binary we created during Setup
    /opt/b2_venv/bin/b2 authorize-account {{ b2_id }} {{ b2_key }}
    /opt/b2_venv/bin/b2 upload-file "nebatn" "{{ temp_backup_path }}" "redis/{{ b2_filename }}"
  no_log: true
  become: true
  vars:
    b2_id: "{{ lookup('env', 'BACKBLAZE_APPLICATION_KEY_ID') }}"
    b2_key: "{{ lookup('env', 'BACKBLAZE_APPLICATION_KEY') }}"

# -----------------------------------------------------------------------------
# PHASE 4: Cleanup
# -----------------------------------------------------------------------------

- name: Clean up temporary backup file
  ansible.builtin.file:
    path: "{{ temp_backup_path }}"
    state: absent
  become: true
