name: workflow 3_Ansible Multi-Region Setup CI/CD Pipeline

on:
  workflow_dispatch: # Allows manual trigger
  #push:
  #branches:
  #  - main
  #paths:
  #  - 'ansible/**' # Only trigger if Ansible code changes

jobs:
  configure-infrastructure:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        aws_region: ["us-east-1", "eu-central-1"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ matrix.aws_region }}

      - name: Set up Ansible and Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: |
          pip install ansible boto3 botocore
          ansible-galaxy collection install community.aws

      - name: Configure SSH Multiplexing (5-minute window)
        run: |
          mkdir -p ~/.ssh
          cat <<EOF >> ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            ControlMaster auto
            ControlPath ~/.ssh/ansible-%r@%h:%p
            ControlPersist 5m
          EOF
          chmod 600 ~/.ssh/config

      - name: Generate Ephemeral SSH Key
        run: |
          ssh-keygen -t rsa -f ~/.ssh/id_rsa -N "" -q
          chmod 600 ~/.ssh/id_rsa

      - name: Inject SSH Keys (Instance Connect)
        run: |
          echo "Searching for instances in ${{ matrix.aws_region }}..."

          # This looks for ANY instance that has a "Service" tag (MongoDB or Redis)
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --region ${{ matrix.aws_region }} \
            --filters "Name=instance-state-name,Values=running" "Name=tag-key,Values=Service" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" == "None" ]; then
            echo "❌ ERROR: No instances with a 'Service' tag found in ${{ matrix.aws_region }}"
            # Let's list what DOES exist to help us debug
            aws ec2 describe-instances --region ${{ matrix.aws_region }} --query "Reservations[*].Instances[*].{ID:InstanceId,Tags:Tags}" --output table
            exit 1
          fi

          for ID in $INSTANCE_IDS; do
            echo "🚀 Sending key to $ID..."
            aws ec2-instance-connect send-ssh-public-key \
              --region ${{ matrix.aws_region }} \
              --instance-id $ID \
              --instance-os-user ubuntu \
              --ssh-public-key file://~/.ssh/id_rsa.pub
          done
          sleep 15

      - name: Calculate Target Variables
        id: set_vars
        run: |
          RAW_REGION="${{ matrix.aws_region }}"
          CLEAN_REGION="${RAW_REGION//-/_}"
          echo "CLEAN_REGION=$CLEAN_REGION" >> $GITHUB_OUTPUT

      - name: Run Setup Playbook
        run: |
          # Pointing to site.yml which contains your setup/config roles
          ansible-playbook -i ansible/inventory/aws_ec2.yml \
            ansible/playbooks/site.yml \
            -e "target_region=${{ steps.set_vars.outputs.CLEAN_REGION }}" \
            --private-key ~/.ssh/id_rsa \
            -vv \
            --limit "region_${{ steps.set_vars.outputs.CLEAN_REGION }}"
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
          AWS_REGION: ${{ matrix.aws_region }}
